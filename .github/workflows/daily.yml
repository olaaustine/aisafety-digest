name: Daily AI Digest

on:
  schedule:
    # 21:00 UTC = 22:00 BST (UK summer) / 21:00 GMT (UK winter)
    # Adjust to 22:00 UTC in winter if needed
    - cron: '0 21 * * *'
  workflow_dispatch: allow manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: python crawler.py

      - name: Commit & push updated digest
        run: |
          git config user.name "AI Digest Bot"
          git config user.email "actions@github.com"
          git add index.html data.json
          git diff --cached --quiet || git commit -m "digest: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
